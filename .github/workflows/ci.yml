name: CI

on:
  push:
  pull_request:

jobs:
  build-test-analyse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libssl-dev cppcheck && pip install gcovr

      - name: Configure (warnings are errors, coverage on)
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DLMS_WERROR=ON -DLMS_COVERAGE=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Run tests
        run: ctest --test-dir build --output-on-failure

      - name: Coverage report
        run: |
          gcovr -r . --filter 'src/services/' --txt-summary build
          gcovr -r . --filter 'src/' --txt-summary build

      - name: Static analysis (cppcheck)
        run: >
          cppcheck --enable=warning,style,performance,portability --std=c++17
          --error-exitcode=1 --inline-suppr -I src src
